apiVersion: batch/v1
kind: Job
metadata:
  name: test-indexed-ingestion
spec:
  backoffLimit: 0
  completionMode: Indexed
  parallelism: 3
  completions: 3
  template:
    metadata:
      labels:
        app: test-indexed
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: test-indexed
            topologyKey: kubernetes.io/hostname
      containers:
      - name: ingestion
        image: 10.2.0.145:32000/etl-pipeline:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "-u", "/scripts/stage_unified.py"]
        env:
        - name: PIPELINE_STAGE
          value: "ingestion"
        - name: INTENSITY
          value: "150"
        - name: AWS_ENDPOINT_URL
          value: "http://localstack.default.svc.cluster.local:4566"
        - name: LOG_LEVEL
          value: "INFO"
        - name: VERBOSE_PRINT
          value: "true"
        - name: SMELL_MODE
          value: "test"
        - name: TRACK_STATE
          value: "false"
        - name: RUN_ID
          value: "test-indexed-001"
        - name: PARALLELISM
          value: "3"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: stage-unified-scripts-v2
