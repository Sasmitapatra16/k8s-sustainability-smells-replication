apiVersion: batch/v1
kind: Job
metadata:
  name: test-integration-chunk0
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: integration
        image: 10.2.0.145:32000/etl-pipeline:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "-u", "/scripts/stage_unified.py"]
        env:
        - name: PIPELINE_STAGE
          value: "integration"
        - name: INTENSITY
          value: "150"
        - name: AWS_ENDPOINT_URL
          value: "http://localstack.default.svc.cluster.local:4566"
        - name: LOG_LEVEL
          value: "INFO"
        - name: VERBOSE_PRINT
          value: "true"
        - name: SMELL_MODE
          value: "test"
        - name: TRACK_STATE
          value: "false"
        - name: RUN_ID
          value: "test-chunk-001"
        - name: PARALLELISM
          value: "3"
        - name: JOB_COMPLETION_INDEX
          value: "0"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: stage-unified-scripts-v2
