apiVersion: batch/v1
kind: Job
metadata:
  name: stage-ingestion
  namespace: etl-smelly
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app: etl-smelly
        stage: ingestion
    spec:
      restartPolicy: Never
      containers:
        - name: ingestion
          image: 10.2.0.145:32000/etl-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/scripts/stage_unified.py"]
          env:
            - name: PIPELINE_STAGE
              value: "ingestion"
            - name: INTENSITY
              value: "150"
            - name: AWS_ENDPOINT_URL
              value: "http://localstack.default.svc.cluster.local:4566"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: VERBOSE_PRINT
              value: "true"
            - name: SMELL_MODE
              value: "ss1_over"
            - name: TRACK_STATE
              value: "false"
            - name: RUN_ID
              value: "ss1_over-run1"
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: stage-unified-scripts-v2
